name: Chart regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q main.py adapters.py live_stream.py

      - name: Check frontend JavaScript
        run: node --check static/app.js

      - name: Run tests
        run: pytest -q
